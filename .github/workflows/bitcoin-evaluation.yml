name: Bitcoin Prediction Evaluation

on:
  push:
    branches: [ "master" ]
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

env:
  # Configure the experiment start date (ISO format, UTC)
  # Change this to postpone or restart the experiment
  EXPERIMENT_START_DATE: '2026-09-03'
  EXPERIMENT_DURATION_DAYS: '14'

permissions:
  contents: write

jobs:
  predict-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push commits
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-timesfm-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-timesfm-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install TimesFM with PyTorch backend (CPU) + evaluation deps
          pip install ".[torch]" requests pandas statsmodels

      - name: Check experiment window
        id: check_window
        run: |
          python -c "
          import os, sys
          from datetime import datetime, timedelta, timezone

          start = datetime.strptime(
              os.environ['EXPERIMENT_START_DATE'], '%Y-%m-%d'
          ).replace(tzinfo=timezone.utc)
          duration = int(os.environ['EXPERIMENT_DURATION_DAYS'])
          end = start + timedelta(days=duration)
          now = datetime.now(timezone.utc)

          if now > end:
              print('Experiment window has ended. Skipping.')
              print('active=false', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              sys.exit(0)
          else:
              days_left = (end - now).days
              print(f'Experiment active. {days_left} days remaining.')
              print('active=true', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          "

      - name: Run prediction
        if: steps.check_window.outputs.active == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m evaluation.run_predict --use-timesfm

      - name: Verify previous predictions
        if: steps.check_window.outputs.active == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m evaluation.run_verify

      - name: Commit and push results
        if: steps.check_window.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bitcoin_predictions.csv reports/bitcoin_report.md
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 BTC prediction update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
