name: Bitcoin Prediction Evaluation
on:
  schedule:
    # The light verifier saves every matured hourly target. Minute 17 avoids
    # the busiest scheduler boundary and leaves time for providers to close a bar.
    - cron: '17 * * * *'
    # One independent H24 forecast per UTC day; it replaces that hour's verifier.
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit branch operation; validate before generate/verify/recover
        type: choice
        options: [validate, provider_probe, generate, verify, recover]
        default: validate
# No push trigger: publishing a branch must not start billable work implicitly.
permissions:
  contents: write
concurrency:
  group: btc-forward-ledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout latest serialized branch state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Select scheduled or manual operation
        id: operation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 12 * * *" ]; then
            echo "mode=generate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=verify" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python with pip cache
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: requirements/btc-*.txt
      - name: Verify legacy checksum
        run: echo '6871717a47f9e26c203f6b3ecb0c25f674de36eeb3db781f04cd032cdcda1e50  data/bitcoin_predictions.csv' | sha256sum --check
      - name: Install lightweight operation dependencies
        run: pip install -r requirements/btc-verify.txt
      - name: Require current-code quality attestation
        if: steps.operation.outputs.mode != 'validate' && steps.operation.outputs.mode != 'provider_probe'
        run: python -m evaluation.forward.remote require-gate
      - name: Install pinned CPU inference/test dependencies
        if: steps.operation.outputs.mode == 'validate' || steps.operation.outputs.mode == 'generate'
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install . -r requirements/btc-ci.txt
          pip check
      - name: Cache pinned Hugging Face checkpoint
        if: steps.operation.outputs.mode == 'validate' || steps.operation.outputs.mode == 'generate'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--google--timesfm-3.0-pytorch
          key: btc-timesfm3-${{ runner.os }}-${{ runner.arch }}-43046b85ec22d584a13f8098c2ed39c889e129c2
      - name: QUALITY GATE — BTC regressions and mocked E2E
        if: steps.operation.outputs.mode == 'validate'
        run: |
          mkdir -p reports/remote
          python -m pytest tests/forward tests/test_btc_metrics.py tests/test_btc_csv_manager.py tests/test_btc_simulation.py tests/test_binance.py tests/test_price_verifier.py tests/test_forecast_path.py tests/test_trading_engine.py -q --junitxml=reports/remote/btc-tests.xml
      - name: QUALITY GATE — TimesFM source units
        if: steps.operation.outputs.mode == 'validate'
        run: python -m pytest src/timesfm3 -q --junitxml=reports/remote/model-tests.xml
      - name: PROVIDER PROBE — actual runner BTC/USD access
        if: steps.operation.outputs.mode == 'validate' || steps.operation.outputs.mode == 'provider_probe' || steps.operation.outputs.mode == 'generate'
        run: python -m evaluation.forward.provider_probe --output reports/provider-checks-ci.json
      - name: TIMESFM SMOKE — real pinned checkpoint
        if: steps.operation.outputs.mode == 'validate'
        run: python -m evaluation.forward.remote smoke
      - name: Record successful quality gate
        if: steps.operation.outputs.mode == 'validate'
        run: python -m evaluation.forward.remote attest
      - name: PREDICTION / VERIFICATION / RECOVERY and REPORT
        if: steps.operation.outputs.mode == 'generate' || steps.operation.outputs.mode == 'verify' || steps.operation.outputs.mode == 'recover'
        env:
          MODE: ${{ steps.operation.outputs.mode }}
          MODEL_CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
          PIP_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
        run: python -m evaluation.forward.remote "$MODE"
      - name: Persist only fully successful validated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/forward.sqlite data/forward-export.json reports/data.json
          if [ -f reports/provider-checks-ci.json ]; then git add reports/provider-checks-ci.json; fi
          if [ -d reports/remote ]; then git add reports/remote; fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist BTC $MODE evidence [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || { echo 'PERSISTENCE_CONFLICT: remote state was not published'; exit 1; }
          fi
      - name: Retain small failure diagnostics temporarily
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/remote/*.xml
            reports/remote/model-smoke.json
            reports/provider-checks-ci.json
          if-no-files-found: ignore
          retention-days: 1
