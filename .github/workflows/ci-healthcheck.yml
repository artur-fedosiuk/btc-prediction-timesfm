name: CI Healthcheck

on:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/btc-*.txt

      - name: Install healthcheck dependencies
        run: |
          pip install -r requirements/btc-verify.txt
          pip install pytest

      - name: Run minimal quality gate
        run: |
          mkdir -p reports/remote
          python -m pytest tests/forward/test_contracts.py tests/forward/test_storage.py -q --junitxml=reports/remote/ci-healthcheck.xml

      - name: Upload healthcheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-healthcheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/remote/ci-healthcheck.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Warning on failure
        if: failure()
        run: echo "::warning::CI healthcheck failed — run ${{ github.run_id }} on ${{ runner.os }} / Python 3.11"

      - name: Open or update CI failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[CI Healthcheck] Forward pipeline weekly healthcheck failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactsUrl = `${runUrl}/artifacts`;
            const body = [
              "Automated weekly CI healthcheck failed.",
              "",
              `- Run: ${runUrl}`,
              `- Artifacts: ${artifactsUrl}`,
              `- Workflow: ${context.workflow}`,
              `- Trigger: ${context.eventName}`,
              "",
              "Runbook:",
              "1. Retry the failed run once.",
              "2. Verify Python and runner compatibility in workflows.",
              "3. If still failing, open a fix PR or trigger automated remediation."
            ].join("\\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info("Created new CI healthcheck issue");
            }
