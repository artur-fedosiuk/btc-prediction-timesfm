# pre-commit hooks for btc-prediction-timesfm
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        types: [text]
        stages: [commit]
        verbose: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
        types: [python]

      - id: ruff-format
        name: ruff format
        types: [python]